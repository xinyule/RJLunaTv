name: Pull from tracking repo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = keep your own commits; force = discard them'
        required: false
        default: merge
      source_branch:
        description: 'tracking repo branch'
        required: false
        default: main

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"

      - name: Fetch tracking repo
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git remote add tracking https://github.com/xinyule/LunaTV.git
          git fetch tracking "$SRC_BRANCH"

      - name: Merge (keep your commits)
        if: ${{ github.event.inputs.mode == 'merge' }}
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git checkout main
          git merge --no-edit "tracking/$SRC_BRANCH"

      - name: Force reset (discard your commits)
        if: ${{ github.event.inputs.mode == 'force' }}
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git checkout main
          git reset --hard "tracking/$SRC_BRANCH"

      - name: Push
        env:
          PAT: ${{ secrets.MIRROR_PAT }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="${PAT:-$TOKEN}"
          git remote set-url origin "https://x-access-token:${AUTH}@github.com/xinyule/RJLunaTv.git"
          git push --force-with-lease origin main

      - name: Result
        run: git log --oneline -3
