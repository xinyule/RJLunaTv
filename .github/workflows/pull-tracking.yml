name: Pull from tracking repo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = keep your own commits; force = discard them'
        required: false
        default: merge
      source_branch:
        description: 'source branch to pull from'
        required: false
        default: main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"

      - name: Fetch source
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git fetch origin main
          git remote add tracking https://github.com/xinyule/LunaTV.git
          git fetch --tags tracking "$SRC_BRANCH"

      - name: Merge (keep your commits)
        if: ${{ github.event.inputs.mode == 'merge' }}
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git checkout main
          if ! git merge --no-edit --no-commit "tracking/$SRC_BRANCH"; then
            echo "::error::合并冲突，请手动处理后再跑"
            git merge --abort || true
            exit 1
          fi
          bash -c 'git rm -r -q --cached .github/workflows >/dev/null 2>&1 || true
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows 2>/dev/null || true'
          git add -A
          git commit -m "chore: merge from xinyule/LunaTV" || echo "没有需要提交的变更"

      - name: Force reset (discard your commits)
        if: ${{ github.event.inputs.mode == 'force' }}
        env:
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
        run: |
          git checkout main
          git reset --hard "tracking/$SRC_BRANCH"
          bash -c 'git rm -r -q --cached .github/workflows >/dev/null 2>&1 || true
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows 2>/dev/null || true'
          git add -A
          git commit -m "chore: reset to xinyule/LunaTV" || echo "没有需要提交的变更"

      - name: Push
        env:
          PAT: ${{ secrets.MIRROR_PAT }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${PAT:-$TOKEN}@github.com/xinyule/RJLunaTv.git"
          if [ "${{ github.event.inputs.mode }}" = "force" ]; then
            git push --force origin main
          else
            git push origin main
          fi
          git push origin --tags || true

      - name: Result
        run: git log --oneline -3
